name: Deploy Quartz

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # The shared workflow publishes through GitHub Pages actions, which fail on
    # the forge's runner (capacity 1). Run it on the GitHub mirror only.
    if: github.server_url == 'https://github.com'
    uses: GameCult/GameCult-Quartz/.github/workflows/quartz-pages.yml@main
    with:
      content-dir: Delvehold
      overlay-dir: site
      output-dir: quartz-site/public
